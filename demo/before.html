<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾句 · 对照示例（改造前）</title>
<style>
  /* 典型 AI 生成页：每个默认值都打开了一次 */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #fafafa;
    color: #111827;
    text-align: center;
  }
  .nav {
    display: flex; justify-content: center; gap: 28px;
    padding: 18px; border-bottom: 1px solid #e5e7eb;
    background: rgba(255,255,255,.8);
    backdrop-filter: blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
  }
  .nav a { color: #6b7280; text-decoration: none; font-size: 15px; transition: all .3s ease; }
  .hero {
    padding: 88px 24px 64px;
    background: linear-gradient(135deg, #7c3aed 0%, #a855f7 40%, #ec4899 100%);
    color: #ffffff;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: .18em;
    font-size: 13px;
    font-weight: 600;
    opacity: .9;
  }
  .hero h1 {
    font-size: 64px;
    line-height: 1.15;
    margin: 18px 0 16px;
    background: linear-gradient(90deg, #ffffff, #c084fc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p { font-size: 20px; opacity: .92; max-width: 900px; margin: 0 auto 32px; }
  .btn {
    border: none; cursor: pointer;
    padding: 16px 34px; font-size: 18px; font-weight: 600;
    border-radius: 999px; transition: all .3s ease;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
  }
  .btn-primary { background: #ffffff; color: #7c3aed; }
  .btn-ghost {
    background: transparent; color: #ffffff;
    border: 1px solid #ffffff; margin-left: 12px;
    border-radius: 999px; padding: 16px 34px; font-size: 18px;
  }
  .stats {
    display: flex; justify-content: center; gap: 24px;
    padding: 56px 24px; background: #ffffff;
  }
  .stat {
    flex: 1; max-width: 300px; padding: 28px;
    border-radius: 20px;
    border: 1px solid #e5e7eb;
    background: #ffffff;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
    transition: all .3s ease;
  }
  .stat .num { font-size: 48px; font-weight: 800; color: #6366f1; }
  .stat .label { font-size: 15px; color: #9ca3af; margin-top: 6px; }
  .features {
    display: flex; flex-wrap: wrap; gap: 24px; justify-content: center;
    padding: 64px 24px; background: #f3f4f6;
  }
  .card {
    width: 320px; padding: 28px; text-align: left;
    background: #ffffff; border-radius: 16px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
    transition: all .3s ease;
  }
  .card:hover { transform: translateY(-6px) scale(1.02); }
  .card .icon { font-size: 28px; }
  .card h3 { font-size: 24px; margin: 12px 0 8px; }
  .card p { font-size: 16px; color: #6b7280; line-height: 1.5; }
  .card .tag {
    display: inline-block; margin-top: 14px;
    padding: 6px 14px; border-radius: 14px;
    background: linear-gradient(90deg, #f3e8ff, #fce7f3);
    color: #a855f7; font-size: 13px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .cta { padding: 72px 24px; background: #111827; color: #ffffff; }
  .cta h2 { font-size: 32px; margin: 0 0 12px; }
  .cta p { font-size: 18px; color: #9ca3af; margin: 0 auto 28px; }
  footer { padding: 32px; font-size: 13px; color: #9ca3af; background: #ffffff; border-top: 1px solid #e5e7eb; }
</style>
</head>
<body>
  <nav class="nav">
    <a href="#">产品</a><a href="#">价格</a><a href="#">文档</a><a href="#">博客</a><a href="#">登录</a>
  </nav>

  <header class="hero">
    <div class="eyebrow">AI Writing Assistant</div>
    <h1>用 AI 重新定义你的写作体验</h1>
    <p>一键生成高质量文案，无缝融入你的工作流，赋能每一个创作者。</p>
    <button class="btn btn-primary">免费开始</button>
    <button class="btn-ghost">了解更多</button>
  </header>

  <section class="stats">
    <div class="stat"><div class="num">10x</div><div class="label">效率提升</div></div>
    <div class="stat"><div class="num">99.9%</div><div class="label">服务可用性</div></div>
    <div class="stat"><div class="num">50k+</div><div class="label">活跃用户</div></div>
  </section>

  <section class="features">
    <div class="card">
      <div class="icon">✨</div>
      <h3>智能润色</h3>
      <p>AI 自动优化语句结构，让文字更专业、更流畅、更有感染力。</p>
      <span class="tag">快</span>
    </div>
    <div class="card">
      <div class="icon">🚀</div>
      <h3>极速生成</h3>
      <p>毫秒级响应，灵感所至立即成稿，支持多语言与多风格。</p>
      <span class="tag">稳</span>
    </div>
    <div class="card">
      <div class="icon">⚡</div>
      <h3>团队协作</h3>
      <p>实时同步编辑，评论、版本、权限一应俱全，无缝对接团队。</p>
      <span class="tag">省</span>
    </div>
  </section>

  <section class="cta">
    <h2>准备好开始了吗？</h2>
    <p>加入 50000+ 创作者，开启你的高效写作之旅</p>
    <button class="btn btn-primary">立即免费试用</button>
  </section>

  <footer>© 2026 拾句 · 保留所有权利</footer>
</body>
</html>
